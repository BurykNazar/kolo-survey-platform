name: Keep Kolo awake

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-alive.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          for attempt in 1 2; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://kolo-survey-platform.onrender.com/healthz)
            echo "attempt $attempt -> $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1
